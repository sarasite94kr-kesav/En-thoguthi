<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>என் தொகுதி · My Constituency</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Madurai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#f3f1f8; --card:#ffffff; --ink:#17142b; --muted:#625f7a; --line:#e3e0ee;
  --accent:#4b2e83; --accent-soft:#ece6f7; --on-accent:#ffffff;
  --done:#1b7f4b; --done-bg:#e1f4e9;
  --going:#1c63b8; --going-bg:#e1ecfa;
  --plan:#a86400; --plan-bg:#fdf0d9;
  --fix:#c0392b; --fix-bg:#fbe5e2;
  --dot-off:#dcd8ea;
  --shadow:0 1px 2px rgba(23,20,43,.05),0 8px 24px rgba(23,20,43,.06);
  --hero1:#2f1d63; --hero2:#6a42b8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0f0e1a; --card:#181630; --ink:#ece9f8; --muted:#a29fbd; --line:#2a2748;
    --accent:#b79cf0; --accent-soft:#2a2347; --on-accent:#14102a;
    --done:#5fd394; --done-bg:#12301f;
    --going:#7db4f5; --going-bg:#13294a;
    --plan:#f1b955; --plan-bg:#3a2a0d;
    --fix:#ff8d80; --fix-bg:#3b1a17;
    --dot-off:#2d2a4d; --shadow:none; --hero1:#251b4d; --hero2:#4a3a9a;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0f0e1a; --card:#181630; --ink:#ece9f8; --muted:#a29fbd; --line:#2a2748;
  --accent:#b79cf0; --accent-soft:#2a2347; --on-accent:#14102a;
  --done:#5fd394; --done-bg:#12301f;
  --going:#7db4f5; --going-bg:#13294a;
  --plan:#f1b955; --plan-bg:#3a2a0d;
  --fix:#ff8d80; --fix-bg:#3b1a17;
  --dot-off:#2d2a4d; --shadow:none; --hero1:#251b4d; --hero2:#4a3a9a;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hind Madurai","Noto Sans Tamil",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 130px}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2{margin:0}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;max-width:760px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px}
.mark{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--hero1),var(--hero2));display:grid;place-items:center}
.mark i{display:block;width:6px;height:20px;border-radius:3px;background:#fff}
.tools{display:flex;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px;min-height:40px;min-width:40px}

/* picker */
.picker{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:10px;grid-template-columns:1fr;box-shadow:var(--shadow)}
@media(min-width:620px){.picker{grid-template-columns:1fr 1fr}}
label.f{display:grid;gap:4px;font-size:14px;color:var(--muted)}
select,input[type=text],input[type=number]{width:100%;padding:10px 12px;border:1px solid var(--line);background:var(--bg);border-radius:12px;min-height:46px;color:var(--ink)}

/* hero */
.hero{margin-top:14px;border-radius:22px;padding:20px 18px 16px;color:#fff;background:radial-gradient(120% 140% at 100% 0%,var(--hero2),transparent 60%),linear-gradient(160deg,var(--hero1),#1d1245);box-shadow:var(--shadow)}
.hero-top{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.15);border-radius:999px;padding:2px 12px;font-size:14px}
.hero h1{margin:10px 0 16px;font-size:30px;line-height:1.2;font-weight:700}
.hero-body{display:grid;gap:16px;grid-template-columns:132px 1fr;align-items:center}
@media(max-width:360px){.hero-body{grid-template-columns:1fr}}
.grid100{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;width:132px}
.grid100 span{aspect-ratio:1;border-radius:3px;background:rgba(255,255,255,.2)}
.grid100 span.on{background:#ffbf5e}
.hero-say{font-size:19px;line-height:1.4}
.hero-say b{color:#ffd28a}
.hero-sub{margin-top:6px;opacity:.85;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
.chp{border:0;border-radius:999px;padding:6px 12px;background:rgba(255,255,255,.15);color:#fff;cursor:pointer;font-size:14px;min-height:38px;display:flex;gap:6px;align-items:center}
.chp b{font-size:16px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
@media(min-width:620px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--shadow)}
.stat .si{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center;font-size:18px;margin-bottom:6px}
.stat .k{color:var(--muted);font-size:14px}
.stat .v{font-size:22px;font-weight:700;line-height:1.25}
.stat .h{color:var(--muted);font-size:13px}

/* bottom navigation */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;display:grid;grid-template-columns:repeat(6,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 24px rgba(23,20,43,.08)}
@media(min-width:760px){.tabs{left:50%;right:auto;transform:translateX(-50%);width:560px;bottom:16px;border-radius:20px;border:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}}
.tab{border:0;background:none;display:grid;justify-items:center;align-content:center;gap:2px;padding:4px 0;cursor:pointer;color:var(--muted);font-size:12px;min-height:54px;border-radius:12px}
.tab .ic{position:relative;display:grid;place-items:center;width:48px;height:28px;border-radius:14px}
.tab[aria-selected="true"]{color:var(--accent);font-weight:600}
.tab[aria-selected="true"] .ic{background:var(--accent-soft)}
.tab .n{position:absolute;top:-5px;right:0;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:11px;display:grid;place-items:center;padding:0 5px;font-weight:700}
.tab[data-tab="fix"] .n{background:var(--fix);color:#fff}

/* floating add button + sheet */
.fab{position:fixed;right:16px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:24;border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);padding:0 20px;min-height:52px;font-weight:700;font-size:16px;box-shadow:0 8px 24px rgba(75,46,131,.35);cursor:pointer}
@media(min-width:760px){.fab{right:max(16px,calc(50% - 380px));bottom:96px}}
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet .back{position:absolute;inset:0;background:rgba(10,8,25,.55)}
.panelS{position:relative;width:min(560px,100%);max-height:92%;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sh-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;font-size:18px}
.x{border:0;background:var(--bg);border-radius:50%;width:40px;height:40px;cursor:pointer;font-size:16px}

/* lists */
.panel{display:grid;gap:10px;margin-top:16px}
.sec{font-size:16px;font-weight:700;margin:10px 2px 0}
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.work{display:grid;grid-template-columns:46px 1fr;gap:12px}
.wi{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:23px;background:var(--accent-soft)}
.s-done .wi,.s-fixed .wi{background:var(--done-bg)}
.s-going .wi{background:var(--going-bg)}
.s-planned .wi{background:var(--plan-bg)}
.s-repair .wi{background:var(--fix-bg)}
.wb{display:grid;gap:6px;min-width:0;align-content:start}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.t{font-weight:600;line-height:1.35}
.cost{font-weight:700;white-space:nowrap}
.m{color:var(--muted);font-size:14px}
.meta{color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;align-items:center}
.meta>*+*::before{content:"•";margin:0 7px;opacity:.5}
.badge{display:inline-block;font-size:13px;font-weight:600;border-radius:999px;padding:1px 10px}
.b-done{background:var(--done-bg);color:var(--done)}
.b-going{background:var(--going-bg);color:var(--going)}
.b-plan{background:var(--plan-bg);color:var(--plan)}
.b-fix{background:var(--fix-bg);color:var(--fix)}
.b-pri{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.pri-high{box-shadow:inset 4px 0 0 var(--fix),var(--shadow)}
.pri-med{box-shadow:inset 4px 0 0 var(--plan),var(--shadow)}
.pri-low{box-shadow:inset 4px 0 0 var(--done),var(--shadow)}
.acts{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.acts .btns{display:flex;gap:6px;flex-wrap:wrap}
.me2{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 14px;cursor:pointer;min-height:40px;font-size:14px}
.me2[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.me2.fx{background:var(--done-bg);color:var(--done);border-color:transparent;font-weight:600}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:26px 18px;text-align:center;color:var(--muted)}
.empty .e{display:block;font-size:36px;margin-bottom:6px}

/* funds */
.fundcard{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
@media(max-width:380px){.fundcard{grid-template-columns:1fr;justify-items:center}}
.donut{width:150px;height:150px;display:block}
.legend{display:grid;gap:12px}
.lg{display:flex;gap:10px;align-items:center}
.lg i{width:14px;height:14px;border-radius:4px;flex:none}
.sector{display:grid;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.bar{height:12px;border-radius:6px;background:var(--dot-off);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}

/* rewards */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px;box-shadow:var(--shadow)}
.pcard{color:#fff;border:0;background:radial-gradient(120% 140% at 100% 0%,var(--hero2),transparent 60%),linear-gradient(160deg,var(--hero1),#1d1245)}
.pcard .m{color:rgba(255,255,255,.8)}
.pcard .lvl{background:rgba(255,255,255,.2)}
.pcard .lvl i{background:#ffbf5e}
.prow{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.lvn{font-size:18px}
.row2{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.big{font-size:44px;font-weight:700;line-height:1.1}
.lvl{height:14px;border-radius:7px;background:var(--dot-off);overflow:hidden}
.lvl i{display:block;height:100%;background:var(--accent);border-radius:7px}
.tier{display:inline-block;border-radius:999px;padding:1px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.t-gold{background:#f7e3a1;color:#5c4400}.t-silver{background:#e3e7ee;color:#3b4658}.t-bronze{background:#f2d3bc;color:#6a3a14}
.t-grow{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.stars{display:flex;gap:2px}
.star{border:0;background:none;font-size:34px;line-height:1;cursor:pointer;color:var(--dot-off);min-width:46px;min-height:46px;padding:0}
.star.on{color:#e0a100}
.rank{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow)}
.rank.me{border-color:var(--accent);background:var(--accent-soft)}
.rank .no{font-weight:700;color:var(--muted);font-size:20px;text-align:center}
.ladder{display:grid;gap:12px}
.lad{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
.lad .dot{width:30px;height:30px;border-radius:50%;background:var(--dot-off);color:var(--muted);display:grid;place-items:center;font-weight:700;font-size:14px}
.lad.on .dot{background:var(--accent);color:var(--on-accent)}
.rules{margin:0;padding-left:20px;color:var(--muted);font-size:15px;display:grid;gap:4px}

/* forms */
details.add{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 14px;box-shadow:var(--shadow)}
details.add summary{cursor:pointer;padding:12px 0;font-weight:600;min-height:46px}
.form{display:grid;gap:10px;padding:4px 0 14px}
@media(min-width:620px){.form.two{grid-template-columns:1fr 1fr}}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:12px;padding:11px 20px;font-weight:700;cursor:pointer;min-height:46px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:70;font-size:15px;max-width:90%}
.foot{margin-top:28px;color:var(--muted);font-size:13px}

@media (prefers-reduced-motion:no-preference){
  .bar i,.lvl i{transition:width .5s ease}
  .grid100 span.on{animation:pop .35s both;animation-delay:calc(var(--i)*9ms)}
  .panel,.stats{animation:fade .3s ease both}
  .panelS{animation:up .28s ease both}
  @keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><span class="mark" aria-hidden="true"><i></i></span><span id="appname"></span></div>
  <div class="tools">
    <button class="chip" id="langBtn" aria-pressed="false"></button>
    <button class="chip" id="themeBtn" aria-label="Theme">◐</button>
  </div>
</div>

<main class="wrap">
  <section class="picker" aria-label="Choose constituency">
    <label class="f"><span id="l-state"></span><select id="state"></select></label>
    <label class="f"><span id="l-const"></span><select id="const"></select></label>
  </section>

  <div id="view"></div>

  <details class="add" id="addConst">
    <summary id="s-addc"></summary>
    <div class="form two" id="addcForm"></div>
  </details>

  <p class="foot" id="foot"></p>
</main>
<nav class="tabs" id="nav" role="tablist" hidden></nav>
<button class="fab" id="fab" hidden></button>
<div class="sheet" id="sheet" hidden>
  <div class="back" id="sheetBack"></div>
  <div class="panelS" role="dialog" aria-modal="true" aria-labelledby="sheetT">
    <div class="sh-h"><b id="sheetT"></b><button class="x" id="sheetX" aria-label="Close">✕</button></div>
    <div id="sheetBody"></div>
  </div>
</div>
<div id="toastHost" aria-live="polite"></div>

function inr(n){

  if(n>=1e5) return "₹"+(n/1e5).toFixed(2).replace(/\.?0+$/,"")+" "+L.lakh;

}

/* ---------- rewards ---------- */
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const sumCost=a=>a.reduce((q,x)=>q+(+x.cost||0),0);
function ratingOf(c){
  const b=c.rate||{avg:0,n:0}, mine=custom.ratings[c.id]||0;
  if(!mine) return {avg:b.avg,n:b.n,mine:0};
  const n=b.n+1; return {avg:(b.avg*b.n+mine)/n,n,mine};
}
function scoreOf(c){
  const ws=worksOf(c);
  const d=ws.filter(x=>x.status==="done"||x.status==="fixed"), g=ws.filter(x=>x.status==="going"),
        p=ws.filter(x=>x.status==="planned"), op=ws.filter(x=>x.status==="repair"), fx=ws.filter(x=>x.status==="fixed");
  const fund=c.allot?clamp((sumCost(d)+sumCost(g))/c.allot,0,1):0;
  const tw=d.length+g.length+p.length, wk=tw?d.length/tw:0;
  const tr=fx.length+op.length, rp=tr?fx.length/tr:0;
  const r=ratingOf(c), rt=r.n?r.avg/5:0;
  const parts=[["sFund",fund,30],["sWorks",wk,25],["sRepair",rp,25],["sRate",rt,20]].map(a=>({k:a[0],f:a[1],m:a[2],pts:a[1]*a[2]}));
  return {total:Math.round(parts.reduce((q,x)=>q+x.pts,0)),parts,has:ws.length>0||r.n>0,r};
}
function tierOf(s){ return s>=80?["gold","tGold"]:s>=65?["silver","tSilver"]:s>=50?["bronze","tBronze"]:["grow","tGrow"]; }
function myPoints(){
  const mine=[];
  Object.keys(custom.works).forEach(k=>(custom.works[k]||[]).forEach(x=>{if(x.by==="me"&&x.orig==="repair")mine.push(x)}));
  const perDay={}; let rep=0, fx=0;
  mine.forEach(x=>{const d=new Date(x.ts||0).toDateString(); perDay[d]=(perDay[d]||0)+1; if(perDay[d]<=5)rep++; if(custom.fixed[x.id])fx++;});
  const rows=[["rep",rep,10],["fx",fx,20],["back",Object.keys(votes).length,2],["rate",Object.keys(custom.ratings).length,3]];
  return {rows,total:rows.reduce((q,r)=>q+r[1]*r[2],0)};
}
function levelOf(pts){ let i=0; t().levels.forEach((l,j)=>{if(pts>=l.min)i=j}); return i; }
function markFixed(id){
  custom.fixed[id]=new Date().toLocaleDateString("en-IN",{month:"short",year:"numeric"});
  store.set("et_custom",custom); toast(t().fixedMsg); renderView();
}
function rateConst(n){
  custom.ratings[curId]=n; store.set("et_custom",custom); toast(t().rateMsg); renderView();
}
const TIER_EMO={gold:"🥇",silver:"🥈",bronze:"🥉",grow:"🌱"};
const medal=i=>i<3?["🥇","🥈","🥉"][i]:String(i+1);
function meTab(c){
  const L=t(), P=myPoints(), li=levelOf(P.total), lv=L.levels[li], nx=L.levels[li+1];
  const prog=nx?clamp((P.total-lv.min)/(nx.min-lv.min),0,1)*100:100;
  const lbl={rep:L.hRep,fx:L.hFx,back:L.hBack,rate:L.hRate};
  const ico={rep:"📝",fx:"✅",back:"👍",rate:"⭐"};
  let h=`<div class="card pcard"><div class="m">🏅 ${L.ptsTitle}</div>
    <div class="prow"><span class="big">${P.total}</span><b class="lvn">${esc(lv.n)}</b></div>
    <div class="lvl" role="img" aria-label="${Math.round(prog)}%"><i style="width:${prog}%"></i></div>
    <div class="m">${nx?L.toNext(nx.min-P.total,esc(nx.n)):L.topLevel}</div></div>`;
  h+=`<div class="card">`+P.rows.map(r=>`<div class="row2"><span>${ico[r[0]]} ${lbl[r[0]]} <span class="m">(${r[1]} × ${r[2]})</span></span><b>${r[1]*r[2]}</b></div>`).join("")+`</div>`;
  h+=`<div class="card"><b>🎁 ${L.rewardLadder}</b><div class="ladder">`+L.levels.map((l,i)=>`<div class="lad${i<=li?" on":""}"><span class="dot">${i<=li?"✓":i+1}</span><div><b>${esc(l.n)}</b> <span class="m">${l.min} ${L.pts}</span><div>${esc(l.r)}</div></div></div>`).join("")+`</div><div class="m">${L.rewardNote}</div></div>`;
  const all=L.board.map(b=>({n:b[0],p:b[1]})).concat([{n:L.you,p:P.total,me:1}]).sort((a,b)=>b.p-a.p);
  const top=all.slice(0,5); if(!top.some(x=>x.me)) top.push(all.find(x=>x.me));
  h+=`<h2 class="sec">👥 ${L.boardTitle}</h2>`+top.map(x=>`<div class="rank${x.me?" me":""}"><span class="no">${medal(all.indexOf(x))}</span><span>${esc(x.n)}</span><b>${x.p}</b></div>`).join("");
  h+=`<div class="card"><b>🛡️ ${L.rulesTitle}</b><ul class="rules">${L.rules.map(r=>`<li>${esc(r)}</li>`).join("")}</ul></div>`;
  return h;
}
function awardTab(c){
  const L=t(), s=scoreOf(c), tr=tierOf(s.total), r=s.r;
  let h=`<div class="card"><b>🏆 ${L.scoreTitle}</b>`;
  if(!s.has) h+=`<div class="m">${L.noScore}</div>`;
  else h+=`<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">${donut(s.total,s.total)}<div><span class="tier t-${tr[0]}">${TIER_EMO[tr[0]]} ${L[tr[1]]}</span><div class="m" style="margin-top:6px">${L.of100}</div></div></div>`;
  const pi={sFund:"💰",sWorks:"🏗️",sRepair:"🔧",sRate:"⭐"};
  s.parts.forEach(p=>{h+=`<div><div class="row2"><span>${pi[p.k]} ${L[p.k]}</span><b>${p.pts.toFixed(1)} / ${p.m}</b></div><div class="bar"><i style="width:${Math.round(p.f*100)}%"></i></div></div>`;});
  h+=`<div class="m">${L.scoreNote}</div></div>`;
  h+=`<div class="card"><b>⭐ ${L.rateTitle}</b><div class="stars">${[1,2,3,4,5].map(i=>`<button class="star${i<=r.mine?" on":""}" data-v="${i}" aria-label="${i} / 5">★</button>`).join("")}</div><div class="m">${r.n?L.rateAvg(r.avg.toFixed(1),num(r.n)):L.noRate}</div></div>`;
  const all=allConsts().map(x=>({c:x,s:scoreOf(x)})).filter(x=>x.s.has).sort((a,b)=>b.s.total-a.s.total).slice(0,10);
  h+=`<h2 class="sec">📊 ${L.rankTitle}</h2>`;
  all.forEach((x,i)=>{const k=tierOf(x.s.total);h+=`<div class="rank${x.c.id===c.id?" me":""}"><span class="no">${medal(i)}</span><span>${esc(cName(x.c))} <span class="m">${esc(stateName(x.c.state))}</span></span><span><b>${x.s.total}</b> <span class="tier t-${k[0]}">${TIER_EMO[k[0]]} ${L[k[1]]}</span></span></div>`;});
  h+=`<div class="card"><b>🎖️ ${L.awardTitle}</b><div>${L.awardText}</div><div class="m">${L.tiersText}</div><div class="m">${L.awardNote}</div></div>`;
  return h;
}
function wire(v){
  v.querySelectorAll(".chp").forEach(b=>b.onclick=()=>{tab=b.dataset.go;renderView();scrollPanel()});
  v.querySelectorAll(".me2").forEach(b=>b.onclick=()=>toggleVote(b.dataset.id));
  v.querySelectorAll(".rm").forEach(b=>b.onclick=()=>removeWork(b.dataset.id));
  v.querySelectorAll(".fx").forEach(b=>b.onclick=()=>markFixed(b.dataset.id));
  v.querySelectorAll(".star").forEach(b=>b.onclick=()=>rateConst(+b.dataset.v));
}

/* ---------- add sheet ---------- */
function openSheet(){
  const L=t(), def=tab==="plan"?"planned":tab==="done"?"done":"repair";
  const opt=(k,l)=>`<option value="${k}"${k===def?" selected":""}>${l}</option>`;
  $("sheetT").textContent=L.addWork;
  $("sheetBody").innerHTML=`<div class="form two">
    <label class="f" style="grid-column:1/-1">${L.wTitle}<input type="text" id="wt" maxlength="120" placeholder="${esc(L.wTitleP)}"></label>
    <label class="f">${L.wKind}<select id="wk">${opt("repair",L.fix)}${opt("planned",L.plan)}${opt("going",L.going)}${opt("done",L.done)}</select></label>
    <label class="f">${L.wSector}<select id="ws">${Object.keys(L.sectors).map(k=>`<option value="${k}">${SIC[k]} ${esc(L.sectors[k])}</option>`).join("")}</select></label>
    <label class="f">${L.wCost}<input type="number" id="wc" min="0" inputmode="numeric"></label>
    <label class="f">${L.wDate}<input type="text" id="wd" maxlength="30" placeholder="Dec 2026"></label>
    <label class="f">${L.wPri}<select id="wp"><option value="high">${L.high}</option><option value="med" selected>${L.med}</option><option value="low">${L.low}</option></select></label>
    <div style="align-self:end"><button class="btn" id="saveWork">${L.save}</button></div>
  </div>`;
  $("sheet").hidden=false; document.body.style.overflow="hidden";
  $("saveWork").onclick=saveWork;
  setTimeout(()=>{const i=$("wt"); if(i) i.focus()},60);
}
function closeSheet(){ $("sheet").hidden=true; document.body.style.overflow=""; }

/* ---------- wiring ---------- */
$("state").onchange=e=>{curState=e.target.value;curId=null;renderConstSelect();renderView()};
$("const").onchange=e=>{curId=e.target.value;renderView()};
$("langBtn").onclick=()=>{lang=lang==="ta"?"en":"ta";store.set("et_lang",lang);renderChrome();renderView()};
$("themeBtn").onclick=()=>{
  const dark=document.documentElement.getAttribute("data-theme")==="dark"||
    (!document.documentElement.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme: dark)").matches);
  theme=dark?"light":"dark";
  document.documentElement.setAttribute("data-theme",theme);store.set("et_theme",theme);
};
$("fab").onclick=openSheet;
$("sheetX").onclick=closeSheet;
$("sheetBack").onclick=closeSheet;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
renderChrome(); renderView();
</script>
</body>
