<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>என் தொகுதி · My Constituency</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Madurai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#f2f5f9; --card:#ffffff; --ink:#0f1b2d; --muted:#5b6b82; --line:#dde4ee;
  --accent:#4b2e83; --accent-soft:#ece6f7; --on-accent:#ffffff;
  --done:#1b7f4b; --done-bg:#e1f4e9;
  --going:#1c63b8; --going-bg:#e1ecfa;
  --plan:#a86400; --plan-bg:#fdf0d9;
  --fix:#c0392b; --fix-bg:#fbe5e2;
  --dot-off:#d5dce8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0e1522; --card:#162033; --ink:#e8edf6; --muted:#9aa9c0; --line:#26344d;
    --accent:#b79cf0; --accent-soft:#2a2347; --on-accent:#14102a;
    --done:#5fd394; --done-bg:#12301f;
    --going:#7db4f5; --going-bg:#13294a;
    --plan:#f1b955; --plan-bg:#3a2a0d;
    --fix:#ff8d80; --fix-bg:#3b1a17;
    --dot-off:#2b3a55;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0e1522; --card:#162033; --ink:#e8edf6; --muted:#9aa9c0; --line:#26344d;
  --accent:#b79cf0; --accent-soft:#2a2347; --on-accent:#14102a;
  --done:#5fd394; --done-bg:#12301f;
  --going:#7db4f5; --going-bg:#13294a;
  --plan:#f1b955; --plan-bg:#3a2a0d;
  --fix:#ff8d80; --fix-bg:#3b1a17;
  --dot-off:#2b3a55;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hind Madurai","Noto Sans Tamil","Latin Modern Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.wrap{max-width:880px;margin:0 auto;padding:0 16px 56px}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;max-width:880px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.mark{width:34px;height:34px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
.mark i{display:block;width:6px;height:20px;border-radius:3px;background:var(--accent)}
.tools{display:flex;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px;min-height:36px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

/* picker */
.picker{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:620px){.picker{grid-template-columns:1fr 1fr}}
label.f{display:grid;gap:4px;font-size:14px;color:var(--muted)}
select,input[type=text],input[type=number]{width:100%;padding:10px 12px;border:1px solid var(--line);background:var(--bg);border-radius:10px;min-height:44px;color:var(--ink)}

/* hero: 100 squares */
.hero{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.hero h1{margin:0;font-size:26px;line-height:1.25}
.hero .sub{color:var(--muted);margin:2px 0 14px}
.hero-body{display:grid;gap:18px;grid-template-columns:1fr;align-items:center}
@media(min-width:620px){.hero-body{grid-template-columns:auto 1fr}}
.grid100{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;width:min(100%,230px)}
.grid100 span{aspect-ratio:1;border-radius:3px;background:var(--dot-off)}
.grid100 span.on{background:var(--accent)}
.hero-say{font-size:20px;line-height:1.4}
.hero-say b{color:var(--accent)}
.hero-note{color:var(--muted);font-size:15px;margin-top:8px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
@media(min-width:620px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat .k{color:var(--muted);font-size:14px}
.stat .v{font-size:22px;font-weight:700;line-height:1.25}
.stat .h{color:var(--muted);font-size:13px}

/* tabs */
.tabs{display:flex;gap:6px;margin:20px 0 12px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;cursor:pointer;min-height:44px;font-weight:500;display:flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.tab .n{font-size:13px;background:rgba(127,127,127,.2);border-radius:999px;padding:0 8px}

.panel{display:grid;gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.item .row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.item .t{font-weight:600}
.item .m{color:var(--muted);font-size:14px}
.cost{font-weight:700;white-space:nowrap}
.badge{display:inline-block;font-size:13px;font-weight:600;border-radius:999px;padding:1px 10px}
.b-done{background:var(--done-bg);color:var(--done)}
.b-going{background:var(--going-bg);color:var(--going)}
.b-plan{background:var(--plan-bg);color:var(--plan)}
.b-fix{background:var(--fix-bg);color:var(--fix)}
.pri-high{border-left:5px solid var(--fix)}
.pri-med{border-left:5px solid var(--plan)}
.pri-low{border-left:5px solid var(--done)}
.me2{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;cursor:pointer;min-height:36px;font-size:14px}
.me2[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted)}

/* fund view */
.sector{display:grid;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.sector .row{display:flex;justify-content:space-between;gap:10px}
.bar{height:12px;border-radius:6px;background:var(--dot-off);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.fundline{display:grid;gap:8px;grid-template-columns:repeat(3,1fr)}
.fundline div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.fundline .k{color:var(--muted);font-size:13px}
.fundline .v{font-weight:700;font-size:18px}

/* forms */
details.add{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
details.add summary{cursor:pointer;padding:12px 0;font-weight:600;min-height:44px}
.form{display:grid;gap:10px;padding:4px 0 14px}
@media(min-width:620px){.form.two{grid-template-columns:1fr 1fr}}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:10px;padding:11px 18px;font-weight:600;cursor:pointer;min-height:44px}
.btn.alt{background:var(--accent-soft);color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:40;font-size:15px}
.foot{margin-top:28px;color:var(--muted);font-size:13px}
.srch{margin-top:10px}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .5s ease}}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><span class="mark" aria-hidden="true"><i></i></span><span id="appname"></span></div>

    <button class="chip" id="langBtn" aria-pressed="false"></button>

</div>

<main class="wrap">

  <div id="view"></div>

  <details class="add" id="addConst">
    <summary id="s-addc"></summary>
    <div class="form two" id="addcForm"></div>
  </details>

  <p class="foot" id="foot"></p>
</main>
<div id="toastHost" aria-live="polite"></div>

 {id:"s-mdu",state:"Tamil Nadu",name:"Madurai",ta:"மதுரை",type:"ls",pop:2020000,voters:1480000,area:980,allot:50000000,works:[
  w("b1","Footpath and drain along Vaigai river road","sanitation",11000000,"done","Nov 2025","med",0,"வைகை ஆற்றுச் சாலையில் நடைபாதை, வடிகால்"),
  w("b2","Anganwadi buildings, 12 villages","education",6600000,"done","Apr 2026","low",0,"12 கிராமங்களில் அங்கன்வாடிக் கட்டிடங்கள்"),
  w("b3","Ambulance bay at Government hospital","health",4300000,"going","Due Jan 2027","high",0,"அரசு மருத்துவமனையில் ஆம்புலன்ஸ் நிறுத்துமிடம்"),
  w("b4","Solar high-mast lights, 20 junctions","power",5200000,"planned","Start Jan 2027","med",0,"20 சந்திப்புகளில் சூரிய உயர்கோபுர விளக்குகள்"),
  w("b5","Broken culvert at Thirunagar","roads",1400000,"repair","Reported Oct 2026","high",178,"திருநகரில் உடைந்த சிறுபாலம்"),
  w("b6","Overflowing sewage near market","sanitation",800000,"repair","Reported Oct 2026","high",203,"சந்தை அருகே கழிவுநீர் வழிகிறது")]},
 {id:"s-blr",state:"Karnataka",name:"Bengaluru South",ta:"",type:"ls",pop:2600000,voters:1940000,area:310,allot:50000000,works:[
  w("c1","Rainwater harvesting pits, 40 streets","water",4800000,"done","Jul 2025","low"),
  w("c2","Junction improvement, Jayanagar","roads",15000000,"done","Feb 2026","med"),
  w("c3","Government school lab upgrade","education",3900000,"going","Due Dec 2026","med"),
  w("c4","Lake edge fencing and cleaning","sanitation",9000000,"planned","Start Mar 2027","med"),
  w("c5","Footpath slabs broken, 4th Block","roads",700000,"repair","Reported Oct 2026","med",88)]},
 {id:"s-pune",state:"Maharashtra",name:"Pune",ta:"",type:"ls",pop:2450000,voters:1790000,area:520,allot:50000000,works:[
  w("d1","Bus shelters with lights, 30 stops","power",6000000,"done","May 2025","low"),
  w("d2","Water-line replacement, Kothrud","water",13000000,"done","Dec 2025","med"),
  w("d3","Dialysis unit at civic hospital","health",9500000,"going","Due Nov 2026","high"),
  w("d4","Cycle track on University Road","roads",7000000,"planned","Start Jan 2027","low"),
  w("d5","Garbage collection point overflowing","sanitation",300000,"repair","Reported Oct 2026","med",64)]},
 {id:"s-ekm",state:"Kerala",name:"Ernakulam",ta:"",type:"ls",pop:2000000,voters:1470000,area:700,allot:50000000,works:[
  w("e1","Canal desilting, 8 km","sanitation",8800000,"done","Jun 2025","high"),
  w("e2","Link road resurfacing, Edappally","roads",6500000,"done","Oct 2025","med"),
  w("e3","Library and study room, Aluva","education",4200000,"going","Due Jan 2027","low"),
  w("e4","Flood-proof pumping station","water",14000000,"planned","Start Apr 2027","high"),
  w("e5","Street light failures, Kakkanad road","power",350000,"repair","Reported Oct 2026","med",57)]}
];

/* ---------- state ---------- */
let lang="ta", theme=null, curState="Tamil Nadu", curId="s-cbe", tab="done";
let custom={consts:[],works:{},removed:{}}, votes={};
const store={
  get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
(function load(){
  const c=store.get("et_custom"); if(c) custom=Object.assign(custom,c);
  const v=store.get("et_votes"); if(v) votes=v;
  const l=store.get("et_lang"); if(l) lang=l;
  const th=store.get("et_theme"); if(th){theme=th;document.documentElement.setAttribute("data-theme",th)}
})();
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const t=()=>T[lang];

function allConsts(){ return SAMPLE.concat(custom.consts); }
function constsOf(state){ return allConsts().filter(c=>c.state===state); }
function getConst(id){ return allConsts().find(c=>c.id===id); }
function worksOf(c){
  const extra=custom.works[c.id]||[];
  return c.works?c.works.concat(extra):extra;
}

/* ---------- number formatting (Indian system) ---------- */
function inr(n){
  const L=t();
  if(n>=1e7) return "₹"+(n/1e7).toFixed(2).replace(/\.?0+$/,"")+" "+L.crore;
  if(n>=1e5) return "₹"+(n/1e5).toFixed(2).replace(/\.?0+$/,"")+" "+L.lakh;
  return "₹"+Math.round(n).toLocaleString("en-IN");
}
const num=n=>Math.round(n).toLocaleString("en-IN");

/* ---------- render ---------- */
function stateName(s){return lang==="ta"&&STATES_TA[s]?STATES_TA[s]:s}
function cName(c){return lang==="ta"&&c.ta?c.ta:c.name}
function wTitle(x){return lang==="ta"&&x.ta?x.ta:x.title}

function renderChrome(){
  const L=t();
  document.documentElement.lang=lang;
  $("appname").textContent=L.app;
  document.title=L.app+" · "+(lang==="ta"?"My Constituency":"என் தொகுதி");
  $("langBtn").textContent=L.lang;
  $("l-state").textContent=L.state; $("l-const").textContent=L.const;
  $("s-addc").textContent="+ "+L.addC;
  $("foot").textContent=L.foot;
  $("state").innerHTML=STATES.map(s=>`<option value="${esc(s)}"${s===curState?" selected":""}>${esc(stateName(s))}</option>`).join("");
  renderConstSelect();
  renderAddConstForm();
}
function renderConstSelect(){
  const L=t(), list=constsOf(curState);
  const sel=$("const");
  if(!list.length){ sel.innerHTML=`<option value="">${esc(L.noConst)}</option>`; sel.disabled=true; curId=null; return; }
  sel.disabled=false;
  if(!list.find(c=>c.id===curId)) curId=list[0].id;
  sel.innerHTML=list.map(c=>`<option value="${c.id}"${c.id===curId?" selected":""}>${esc(cName(c))}</option>`).join("");
}

function renderView(){
  const L=t(), c=curId&&getConst(curId), v=$("view");
  if(!c){ v.innerHTML=`<div class="empty" style="margin-top:16px">${esc(L.noConst)}<br>${esc(L.addC)} ↓</div>`; return; }
  const works=worksOf(c);
  const sum=(arr)=>arr.reduce((a,x)=>a+(+x.cost||0),0);
  const done=works.filter(x=>x.status==="done"), going=works.filter(x=>x.status==="going"),
        plan=works.filter(x=>x.status==="planned"), fix=works.filter(x=>x.status==="repair");
  const spent=sum(done)+sum(going), allot=c.allot||0;
  const pct=allot?Math.min(100,Math.round(spent/allot*100)):0;
  const typeLbl=c.type==="ls"?L.ls:c.type==="as"?L.as:L.ward;

  let h=`
  <section class="hero" aria-labelledby="hname">
    <h1 id="hname">${esc(cName(c))}</h1>
    <p class="sub">${esc(stateName(c.state))} · ${esc(typeLbl)}</p>
    <div class="hero-body">
      <div class="grid100" role="img" aria-label="${pct}%">${Array.from({length:100},(_,i)=>`<span class="${i<pct?"on":""}"></span>`).join("")}</div>
      <div>
        <div class="hero-say">${L.heroSay(pct)}</div>
        <div class="hero-note">${L.heroNote(done.length,going.length,plan.length,fix.length)}</div>
      </div>
    </div>
  </section>
  <section class="stats">
    <div class="stat"><div class="k">${L.people}</div><div class="v">${num(c.pop||0)}</div></div>
    <div class="stat"><div class="k">${L.voters}</div><div class="v">${num(c.voters||0)}</div></div>
    <div class="stat"><div class="k">${L.allotted}</div><div class="v">${inr(allot)}</div></div>
    <div class="stat"><div class="k">${L.area}</div><div class="v">${num(c.area||0)}</div><div class="h">${L.sqkm}</div></div>
  </section>
  <div class="tabs" role="tablist">
    ${[["fund",L.tFund,null],["done",L.tDone,done.length],["fix",L.tFix,fix.length],["plan",L.tPlan,plan.length+going.length]].map(([k,n,cnt])=>
      `<button class="tab" role="tab" data-tab="${k}" aria-selected="${tab===k}">${n}${cnt!==null?` <span class="n">${cnt}</span>`:""}</button>`).join("")}
  </div>
  <div class="panel" id="panel">`;

  if(tab==="fund"){
    h+=`<div class="fundline">
      <div><div class="k">${L.allotted}</div><div class="v">${inr(allot)}</div></div>
      <div><div class="k">${L.spent}</div><div class="v">${inr(spent)}</div></div>
      <div><div class="k">${L.left}</div><div class="v">${inr(Math.max(0,allot-spent))}</div></div></div>
      <h2 style="font-size:18px;margin:10px 0 0">${L.bySector}</h2>`;
    const by={};
    done.concat(going).forEach(x=>by[x.sector]=(by[x.sector]||0)+(+x.cost||0));
    const keys=Object.keys(by).sort((a,b)=>by[b]-by[a]);
    const max=keys.length?by[keys[0]]:1;
    if(!keys.length) h+=`<div class="empty">${L.emptyDone}</div>`;
    keys.forEach(k=>{h+=`<div class="sector"><div class="row"><span>${esc(L.sectors[k]||k)}</span><b>${inr(by[k])}</b></div><div class="bar"><i style="width:${Math.round(by[k]/max*100)}%"></i></div></div>`;});
  }
  if(tab==="done"){
    if(!done.length) h+=`<div class="empty">${L.emptyDone}</div>`;
    done.forEach(x=>h+=workCard(x,c));
  }
  if(tab==="fix"){
    const order={high:0,med:1,low:2};
    fix.sort((a,b)=>(order[a.pri]-order[b.pri])||(vcount(b)-vcount(a)));
    if(!fix.length) h+=`<div class="empty">${L.emptyFix}</div>`;
    fix.forEach(x=>h+=fixCard(x,c));
  }
  if(tab==="plan"){
    if(!(going.length+plan.length)) h+=`<div class="empty">${L.emptyPlan}</div>`;
    going.concat(plan).forEach(x=>h+=workCard(x,c));
  }
  h+=`</div>
  <details class="add" ${tab==="fix"||tab==="done"||tab==="plan"?"":""}>
    <summary>+ ${L.addWork}</summary>
    <div class="form two" id="workForm">
      <label class="f" style="grid-column:1/-1">${L.wTitle}<input type="text" id="wt" maxlength="120" placeholder="${esc(L.wTitleP)}"></label>
      <label class="f">${L.wKind}<select id="wk">
        <option value="repair">${L.fix}</option><option value="planned">${L.plan}</option><option value="going">${L.going}</option><option value="done">${L.done}</option></select></label>
      <label class="f">${L.wSector}<select id="ws">${Object.keys(L.sectors).map(k=>`<option value="${k}">${esc(L.sectors[k])}</option>`).join("")}</select></label>
      <label class="f">${L.wCost}<input type="number" id="wc" min="0" inputmode="numeric"></label>
      <label class="f">${L.wDate}<input type="text" id="wd" maxlength="30" placeholder="Dec 2026"></label>
      <label class="f">${L.wPri}<select id="wp"><option value="high">${L.high}</option><option value="med" selected>${L.med}</option><option value="low">${L.low}</option></select></label>
      <div style="align-self:end"><button class="btn" id="saveWork">${L.save}</button></div>
    </div>
  </details>`;
  v.innerHTML=h;

  v.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderView()});
  v.querySelectorAll(".me2").forEach(b=>b.onclick=()=>toggleVote(b.dataset.id));
  v.querySelectorAll(".rm").forEach(b=>b.onclick=()=>removeWork(b.dataset.id));
  const sw=$("saveWork"); if(sw) sw.onclick=saveWork;
}

function vcount(x){ return (x.votes||0)+(votes[x.id]?1:0); }
function badge(s){
  const L=t();
  return s==="done"?`<span class="badge b-done">${L.done}</span>`:
         s==="going"?`<span class="badge b-going">${L.going}</span>`:
         s==="planned"?`<span class="badge b-plan">${L.plan}</span>`:
         `<span class="badge b-fix">${L.fix}</span>`;
}
function workCard(x,c){
  const L=t(), mine=(custom.works[c.id]||[]).some(y=>y.id===x.id);
  return `<article class="item">
    <div class="row"><div class="t">${esc(wTitle(x))}</div><div class="cost">${x.cost?inr(x.cost):""}</div></div>
    <div class="m">${badge(x.status)} · ${esc(L.sectors[x.sector]||x.sector)}${x.date?" · "+esc(x.date):""}</div>
    ${mine?`<div><button class="me2 rm" data-id="${x.id}">${L.remove}</button></div>`:""}
  </article>`;
}
function fixCard(x,c){
  const L=t(), mine=(custom.works[c.id]||[]).some(y=>y.id===x.id), on=!!votes[x.id];
  return `<article class="item pri-${x.pri}">
    <div class="row"><div class="t">${esc(wTitle(x))}</div><div class="cost">${x.cost?inr(x.cost):""}</div></div>
    <div class="m">${badge("repair")} <span class="badge" style="background:var(--bg)">${L[x.pri]}</span> · ${esc(L.sectors[x.sector]||x.sector)}${x.date?" · "+esc(x.date):""}</div>
    <div class="row" style="align-items:center">
      <span class="m">${L.reportedBy(num(vcount(x)))}</span>
      <span style="display:flex;gap:6px">
        <button class="me2" data-id="${x.id}" aria-pressed="${on}">${on?"✓ ":""}${L.metoo}</button>
        ${mine?`<button class="me2 rm" data-id="${x.id}">${L.remove}</button>`:""}
      </span>
    </div></article>`;
}

/* ---------- actions ---------- */
function toast(msg){
  const d=document.createElement("div");d.className="toast";d.textContent=msg;$("toastHost").appendChild(d);
  setTimeout(()=>d.remove(),2200);
}
function toggleVote(id){
  if(votes[id]) delete votes[id]; else votes[id]=1;
  store.set("et_votes",votes); renderView();
}
function saveWork(){
  const L=t(), title=$("wt").value.trim();
  if(!title){toast(L.needTitle);$("wt").focus();return}
  const x={id:"u"+Date.now(),title,sector:$("ws").value,cost:+$("wc").value||0,status:$("wk").value,date:$("wd").value.trim(),pri:$("wp").value,votes:0};
  (custom.works[curId]=custom.works[curId]||[]).push(x);
  store.set("et_custom",custom);
  tab = x.status==="done"?"done":x.status==="repair"?"fix":"plan";
  renderView(); toast(L.saved);
}
function removeWork(id){
  custom.works[curId]=(custom.works[curId]||[]).filter(x=>x.id!==id);
  store.set("et_custom",custom); renderView();
}
function renderAddConstForm(){
  const L=t();
  $("addcForm").innerHTML=`
    <label class="f" style="grid-column:1/-1">${L.cName}<input type="text" id="cn" maxlength="80"></label>
    <label class="f">${L.cType}<select id="ct"><option value="ls">${L.ls}</option><option value="as">${L.as}</option><option value="ward">${L.ward}</option></select></label>
    <label class="f">${L.cPop}<input type="number" id="cp" min="0" inputmode="numeric"></label>
    <label class="f">${L.cVot}<input type="number" id="cv" min="0" inputmode="numeric"></label>
    <label class="f">${L.cArea}<input type="number" id="ca" min="0" inputmode="numeric"></label>
    <label class="f">${L.cFund}<input type="number" id="cf" min="0" inputmode="numeric"></label>
    <div style="align-self:end"><button class="btn" id="saveConst">${L.save}</button></div>`;
  $("saveConst").onclick=()=>{
    const name=$("cn").value.trim();
    if(!name){toast(L.needName);$("cn").focus();return}
    const c={id:"u"+Date.now(),state:curState,name,ta:"",type:$("ct").value,pop:+$("cp").value||0,voters:+$("cv").value||0,area:+$("ca").value||0,allot:+$("cf").value||0,works:[]};
    custom.consts.push(c); store.set("et_custom",custom);
    curId=c.id; tab="done"; renderConstSelect(); renderView(); toast(L.saved);
    $("addConst").open=false; window.scrollTo({top:0,behavior:"smooth"});
  };
}

/* ---------- wiring ---------- */
$("state").onchange=e=>{curState=e.target.value;curId=null;renderConstSelect();renderView()};
$("const").onchange=e=>{curId=e.target.value;renderView()};
$("langBtn").onclick=()=>{lang=lang==="ta"?"en":"ta";store.set("et_lang",lang);renderChrome();renderView()};
$("themeBtn").onclick=()=>{
  const dark=document.documentElement.getAttribute("data-theme")==="dark"||
    (!document.documentElement.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme: dark)").matches);
  theme=dark?"light":"dark";
  document.documentElement.setAttribute("data-theme",theme);store.set("et_theme",theme);
};
renderChrome(); renderView();
</script>
</body>
